<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edalin Store</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050303; --panel:#0e0707; --line:#2a0c0c;
  --red:#e01b24; --red-hot:#ff4a3d; --red-deep:#7a0b10;
  --text:#f3e9e7; --mute:#9a8583;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
#embers{position:fixed;inset:0;z-index:0;pointer-events:none}
.glow{position:fixed;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(224,27,36,.18),transparent 65%);transform:translate(-50%,-50%);left:50%;top:30%}
main,footer{position:relative;z-index:1}

/* hero */
.hero{min-height:78vh;display:grid;place-items:center;text-align:center;padding:60px 20px 20px;position:relative}
.sigil{position:absolute;width:min(78vmin,640px);aspect-ratio:1;top:50%;left:50%;
  transform:translate(-50%,-50%);mix-blend-mode:screen;opacity:0;animation:sigilIn 2.2s .1s ease-out forwards;
  border-radius:50%;overflow:hidden;clip-path:circle(49.5% at 50% 50%)}
.sigil img{width:100%;height:100%;object-fit:cover;border-radius:50%;animation:spin 70s linear infinite}
.sigil::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 120px 10px rgba(224,27,36,.25) inset;animation:pulse 4s ease-in-out infinite}
.hero h1{font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(2.6rem,9vw,6rem);letter-spacing:-.02em;line-height:1;position:relative}
.hero h1 span{display:inline-block;opacity:0;transform:translateY(40px) rotate(4deg);animation:letter .8s cubic-bezier(.2,.9,.2,1) forwards}
.hero p{margin-top:20px;color:var(--mute);font-size:1.05rem;position:relative;opacity:0;animation:fade 1s 1.4s forwards}
.hero .down{display:inline-block;margin-top:34px;color:var(--red-hot);text-decoration:none;font-weight:600;position:relative;opacity:0;animation:fade 1s 1.8s forwards,bob 2s 2.8s ease-in-out infinite}

/* store list */
.store{max-width:900px;margin:0 auto;padding:40px 20px 80px}
.store h2{font-family:'Unbounded',sans-serif;font-weight:500;font-size:1.3rem;margin-bottom:22px;display:flex;align-items:center;gap:14px}
.store h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--red-deep),transparent)}
.row{display:flex;align-items:center;gap:20px;padding:18px 20px;margin-bottom:14px;background:linear-gradient(100deg,var(--panel),#0a0505);
  border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden;
  transition:transform .35s cubic-bezier(.2,.9,.2,1),border-color .3s,box-shadow .3s;
  opacity:0;transform:translateX(-30px)}
.row.in{opacity:1;transform:none;transition:opacity .7s,transform .7s cubic-bezier(.2,.9,.2,1),border-color .3s,box-shadow .3s}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);transform:scaleY(0);transition:transform .35s;transform-origin:top}
.row:hover{border-color:var(--red-deep);box-shadow:0 10px 40px -12px rgba(224,27,36,.45);transform:translateX(6px)}
.row.in:hover{transform:translateX(6px)}
.row:hover::before{transform:scaleY(1)}
.icon{width:72px;height:72px;border-radius:18px;flex:none;background:#000 url(logo.jpg) center/cover;border:1px solid var(--line);position:relative;overflow:hidden}
.icon::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);transform:translateX(-120%);transition:transform .7s}
.row:hover .icon::after{transform:translateX(120%)}
.info{flex:1;min-width:0}
.info h3{font-family:'Unbounded',sans-serif;font-weight:500;font-size:1.1rem}
.info p{color:var(--mute);margin-top:6px;font-size:.93rem;line-height:1.5}
.tag{display:inline-block;margin-top:8px;font-size:.75rem;color:var(--red-hot);border:1px solid var(--red-deep);border-radius:99px;padding:2px 10px}
.open{flex:none;position:relative;overflow:hidden;text-decoration:none;color:var(--text);font-weight:600;padding:12px 30px;border-radius:99px;
  border:1px solid var(--red);isolation:isolate;transition:color .3s,transform .2s,box-shadow .3s}
.open::before{content:"";position:absolute;inset:0;background:var(--red);z-index:-1;transform:translateY(101%);transition:transform .35s cubic-bezier(.2,.9,.2,1)}
.open:hover::before{transform:none}
.open:hover{box-shadow:0 0 28px rgba(224,27,36,.55)}
.open:active{transform:scale(.94)}
.open:focus-visible,.down:focus-visible{outline:2px solid var(--red-hot);outline-offset:3px}

/* footer */
footer{border-top:1px solid var(--line);padding:26px 24px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mute);font-size:.9rem}
footer b{color:var(--text);font-weight:600}
footer .heart{color:var(--red-hot);display:inline-block;animation:pulse 1.6s infinite}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sigilIn{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:.85;transform:translate(-50%,-50%) scale(1)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes letter{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes bob{50%{transform:translateY(8px)}}
@media(max-width:620px){
  .row{flex-wrap:wrap}
  .open{width:100%;text-align:center}
  .icon{width:60px;height:60px}
  footer{flex-direction:column;text-align:center}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}
}
</style>
</head>
<body>
<canvas id="embers"></canvas>
<div class="glow" id="glow"></div>

<main>
  <section class="hero">
    <div class="sigil"><img src="logo.jpg" alt=""></div>
    <div>
      <h1 id="title" aria-label="Edalin Store"></h1>
      <p>Every app I build, in one place.</p>
      <a class="down" href="#apps">Browse apps</a>
    </div>
  </section>

  <section class="store" id="apps">
    <h2>Apps</h2>
    <div id="list"></div>
  </section>
</main>

<footer>
  <div>Support by <b>Edalin</b></div>
  <div>Created by <b>Pulariz</b> <span class="heart">&#9829;</span></div>
</footer>

<script>
/* ====== EDIT YOUR APPS HERE ======
   name: app name | desc: short description | tag: small label | url: GitHub link opened by "Open"
   icon: optional image path (leave empty to use the logo) */
const APPS = [
  { name:"EdaWeb",   desc:"Ultra Optimized Browser.",  tag:"Web",     url:"https://pularizz.github.io/EdaWeb",   icon:"" },
  { name:"EdAim",   desc:"Better Your AIM.", tag:"Game",     url:"https://pularizz.github.io/EdAim/",   icon:"" },
  { name:"EdArchive", desc:"App For Archive Your Files.",  tag:"Utility",  url:"https://pularizz.github.io/EDarchive/", icon:"" },
  { name:"Edalin-DNS",  desc:"The DNS Changer.", tag:"Network",  url:"https://pularizz.github.io/Edalin-DNS/",  icon:"" }
];

/* title letters */
const t=document.getElementById('title');
[..."Edalin Store"].forEach((ch,i)=>{
  const s=document.createElement('span');
  s.textContent=ch===" "?"\u00A0":ch;
  s.style.animationDelay=(0.4+i*0.07)+"s";
  s.setAttribute('aria-hidden','true');
  t.appendChild(s);
});

/* rows */
const list=document.getElementById('list');
APPS.forEach(a=>{
  const r=document.createElement('article');
  r.className='row';
  r.innerHTML=
    '<div class="icon"></div>'+
    '<div class="info"><h3></h3><p></p><span class="tag"></span></div>'+
    '<a class="open" target="_blank" rel="noopener">Open</a>';
  r.querySelector('h3').textContent=a.name;
  r.querySelector('p').textContent=a.desc;
  r.querySelector('.tag').textContent=a.tag;
  r.querySelector('.open').href=a.url;
  if(a.icon) r.querySelector('.icon').style.backgroundImage='url('+a.icon+')';
  list.appendChild(r);
});
const io=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    const i=[...list.children].indexOf(e.target);
    setTimeout(()=>e.target.classList.add('in'),i*140);
    io.unobserve(e.target);
  }});
},{threshold:.15});
[...list.children].forEach(c=>io.observe(c));

/* cursor glow */
const g=document.getElementById('glow');
addEventListener('pointermove',e=>{g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'});

/* floating embers */
const cv=document.getElementById('embers'),cx=cv.getContext('2d');
let W,H,P=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',size);size();
for(let i=0;i<70;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,v:Math.random()*.5+.15,d:Math.random()*Math.PI*2});
(function loop(){
  cx.clearRect(0,0,W,H);
  P.forEach(p=>{
    p.y-=p.v;p.d+=.01;p.x+=Math.sin(p.d)*.3;
    if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);
    cx.fillStyle='rgba(255,'+(60+p.r*30|0)+',50,'+(.25+p.r*.2)+')';
    cx.fill();
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
